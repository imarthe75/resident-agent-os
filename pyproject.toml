[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resident-agent-os"
version = "1.0.2"
description = "Provider-agnostic Resident Agent OS: unified CLI (ros), local MCP server, Hub-and-Spoke memory, verifiers, and fleet observability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ros = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "memory*", "verifiers*", "scripts*"]
