<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>Sistema Core — CASMART</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.cdnfonts.com" />
        <link href="https://fonts.cdnfonts.com/css/lato" rel="stylesheet" />
        <style>
            /* Evita el flash de colores antes de que Angular cargue el tema PrimeNG */
            html, body {
                margin: 0;
                padding: 0;
                min-height: 100%;
                background-color: #f1f5f9; /* --p-surface-100 del CompramexPreset (modo claro) */
                font-family: 'Lato', sans-serif;
            }
            /* Spinner de carga inicial */
            .app-loading {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            .app-loading::after {
                content: '';
                width: 48px;
                height: 48px;
                border: 4px solid #e2e8f0;
                border-top-color: #4682B4; /* Steel Blue — C&A Smart primary */
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </head>

    <body>
        <app-root>
            <div class="app-loading"></div>
        </app-root>
    </body>
</html>
