# =============================================================
#  lexivault.casmart.internal  —  LexiVault AI (Bóveda Documental)
# =============================================================
server {
    listen 80;
    server_name lexivault.casmart.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lexivault.casmart.internal;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Permitir subida de documentos grandes (hasta 200 MB)
    client_max_body_size 200M;

    # Resolver DNS interno de Docker (resuelve en tiempo de request)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API Backend ----------------------------------------
    location /api/ {
        set $lexivault_backend http://lexivault-backend:5000;
        proxy_pass         $lexivault_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Frontend SPA ----------------------------------------
    location / {
        set $lexivault_frontend http://lexivault-frontend:80;
        proxy_pass         $lexivault_frontend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
