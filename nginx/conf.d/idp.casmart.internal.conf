# =============================================================
#  idp.casmart.internal  —  IDP-Smart (Extractor PDF a JSON)
# =============================================================
server {
    listen 80;
    server_name idp.casmart.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name idp.casmart.internal;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Permitir subida de PDFs grandes (hasta 100 MB)
    client_max_body_size 100M;

    # Resolver DNS interno de Docker (resuelve en tiempo de request)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API Backend ----------------------------------------
    location /api/ {
        set $idp_backend http://casmarts-idp-api:8000;
        proxy_pass         $idp_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---- Frontend SPA (Vite dev server) ----------------------
    location / {
        set $idp_frontend http://casmarts-idp-frontend:5173;
        proxy_pass         $idp_frontend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Soporte Hot-Module-Replacement de Vite (WS)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
