# =============================================================
#  chat.casmart.internal  —  Consulta-Smart (Chatbot IA)
# =============================================================
server {
    listen 80;
    server_name chat.casmart.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.casmart.internal;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Resolver DNS interno de Docker (resuelve en tiempo de request)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API Backend ----------------------------------------
    location /api/ {
        set $consulta_backend http://consulta-smart-backend:8000;
        proxy_pass         $consulta_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- WebSocket (streaming de chat) ----------------------
    location /ws/ {
        set $consulta_backend http://consulta-smart-backend:8000;
        proxy_pass         $consulta_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---- Frontend SPA ----------------------------------------
    location / {
        set $consulta_frontend http://consulta-smart-frontend:3000;
        proxy_pass         $consulta_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
