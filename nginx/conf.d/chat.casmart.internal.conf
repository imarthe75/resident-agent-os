# =============================================================
#  chat.casmart.internal  —  Consulta-Smart (Chatbot IA)
# =============================================================
server {
    listen 80;
    server_name chat.casmart.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.casmart.internal;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Resolver DNS interno de Docker (resuelve en tiempo de request)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Cabeceras de seguridad (auditoría 2026-07-29) -------
    # HSTS/nosniff/Referrer-Policy son seguras para TODA la app, incluida /api/.
    # Deliberadamente NO se aplica X-Frame-Options/CSP frame-ancestors aquí a nivel
    # global: el widget embebible (ver WidgetIntegrationPage.jsx) depende de que el
    # chat pueda incrustarse vía <iframe>/<script> en sitios de terceros — igual que
    # CORS_ORIGINS="*" en el backend (con allow_credentials=False), es una decisión
    # de diseño intencional, no un descuido. La protección anti-clickjacking se
    # aplica solo al panel /admin más abajo, que nunca debe embeberse.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Compresión (auditoría 2026-07-29) -------------------
    # `gzip on;` ya está activo globalmente en nginx.conf, pero sin gzip_types el
    # default de nginx solo comprime text/html — el tráfico real de esta app
    # (JSON de la API, JS/CSS del bundle de Vite) no se comprimía.
    gzip_types application/json application/javascript application/x-javascript
               text/css text/javascript text/plain application/xml image/svg+xml;
    gzip_min_length 512;
    gzip_proxied any;

    # ---- Panel de administración (clickjacking) --------------
    # Único punto de la app que NUNCA debe poder embeberse en un <iframe> de
    # terceros, a diferencia del resto del sitio (ver nota arriba).
    location /admin {
        set $consulta_frontend http://consulta-smart-frontend:3000;
        proxy_pass         $consulta_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # ---- API Backend ----------------------------------------
    location /api/ {
        set $consulta_backend http://consulta-smart-backend:8000;
        proxy_pass         $consulta_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- WebSocket (streaming de chat) ----------------------
    location /ws/ {
        set $consulta_backend http://consulta-smart-backend:8000;
        proxy_pass         $consulta_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ---- Frontend SPA (incluye el widget embebible) ----------
    location / {
        set $consulta_frontend http://consulta-smart-frontend:3000;
        proxy_pass         $consulta_frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
