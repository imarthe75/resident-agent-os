version: '3.8'

services:
  kiwi:
    build: .
    container_name: kiwi-tcms
    restart: always
    ports:
      - "8080:8080"
      - "8444:8443"
    environment:
      - KIWI_DB_ENGINE=django.db.backends.postgresql
      - KIWI_DB_NAME=kiwi_db
      - KIWI_DB_USER=kiwi_user
      - KIWI_DB_PASSWORD=kiwi_secure_password_2026
      - KIWI_DB_HOST=10.4.3.23
      - KIWI_DB_PORT=5432
      - SOCIAL_AUTH_OIDC_KEY=kiwi_client_id_2026
      - SOCIAL_AUTH_OIDC_SECRET=kiwi_client_secret_super_secure_2026
    extra_hosts:
      - "auth.casmart.internal:10.4.3.208"
    volumes:
      - ./local_settings.py:/venv/lib/python3.12/site-packages/tcms/settings/local_settings.py
      - ./custom_urls.py:/venv/lib/python3.12/site-packages/tcms/settings/custom_urls.py
      - ./templates:/venv/lib/python3.12/site-packages/tcms/templates/custom
      - kiwi_uploads:/Kiwi/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  kiwi_uploads:
