version: '3.8'

services:
  reverse-proxy:
    image: caddy:latest
    container_name: global-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - kiwi_net
      - plane_net

networks:
  kiwi_net:
    name: kiwi_default
    external: true
  plane_net:
    name: plane_default
    external: true

volumes:
  caddy_data:
  caddy_config:
