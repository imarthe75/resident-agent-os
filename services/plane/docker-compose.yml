x-db-env: &db-env
  PGHOST: ${PGHOST}
  PGDATABASE: ${PGDATABASE}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PORT: ${POSTGRES_PORT}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_URL: ${REDIS_URL}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
  CERT_EMAIL: ${CERT_EMAIL}
  CERT_ACME_CA: ${CERT_ACME_CA}
  CERT_ACME_DNS: ${CERT_ACME_DNS}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
  SITE_ADDRESS: ${SITE_ADDRESS}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  RABBITMQ_PORT: ${RABBITMQ_PORT}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL}
  DEBUG: ${DEBUG}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO}
  DATABASE_URL: ${DATABASE_URL}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: ${AMQP_URL}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  # Gitea OAuth via gitea-bridge (Caddy rutea rutas Gitea→Authentik en plane.casmart.internal HTTPS)
  GITEA_HOST: ${GITEA_HOST}
  GITEA_CLIENT_ID: ${GITEA_CLIENT_ID}
  GITEA_CLIENT_SECRET: ${GITEA_CLIENT_SECRET}
  # CA combinada: certifi standard + Caddy local CA (para llamadas HTTPS a plane.casmart.internal)
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/combined_ca.crt

# extra_hosts para que los contenedores backend alcancen plane.casmart.internal via Caddy HTTPS
x-gitea-hosts: &gitea-hosts
  extra_hosts:
    - "plane.casmart.internal:host-gateway"

services:
  web:
    image: makeplane/plane-frontend:${APP_RELEASE}
    deploy:
      replicas: ${WEB_REPLICAS}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker

  space:
    image: makeplane/plane-space:${APP_RELEASE}
    deploy:
      replicas: ${SPACE_REPLICAS}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
      - web

  admin:
    image: makeplane/plane-admin:${APP_RELEASE}
    deploy:
      replicas: ${ADMIN_REPLICAS}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  live:
    image: makeplane/plane-live:${APP_RELEASE}
    environment:
      <<: [*live-env, *redis-env]
    deploy:
      replicas: ${LIVE_REPLICAS}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: plane-backend-custom:${APP_RELEASE}
    command: ./bin/docker-entrypoint-api.sh
    <<: *gitea-hosts
    deploy:
      replicas: ${API_REPLICAS}
      restart_policy:
        condition: any
    volumes:
      - logs_api:/code/plane/logs
      - /opt/prism/services/plane/combined_ca.crt:/etc/ssl/certs/combined_ca.crt:ro
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-redis
      - plane-mq

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: plane-backend-custom:${APP_RELEASE}
    command: ./bin/docker-entrypoint-worker.sh
    <<: *gitea-hosts
    deploy:
      replicas: ${WORKER_REPLICAS}
      restart_policy:
        condition: any
    volumes:
      - logs_worker:/code/plane/logs
      - /opt/prism/services/plane/combined_ca.crt:/etc/ssl/certs/combined_ca.crt:ro
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-redis
      - plane-mq

  beat-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: plane-backend-custom:${APP_RELEASE}
    command: ./bin/docker-entrypoint-beat.sh
    <<: *gitea-hosts
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS}
      restart_policy:
        condition: any
    volumes:
      - logs_beat-worker:/code/plane/logs
      - /opt/prism/services/plane/combined_ca.crt:/etc/ssl/certs/combined_ca.crt:ro
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - api
      - plane-redis
      - plane-mq

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: plane-backend-custom:${APP_RELEASE}
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - plane-redis

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *proxy-env
    ports:
      - target: 80
        published: ${LISTEN_HTTP_PORT}
        protocol: tcp
        mode: host
      - target: 443
        published: ${LISTEN_HTTPS_PORT}
        protocol: tcp
        mode: host
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live

volumes:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
