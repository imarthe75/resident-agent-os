# Pre-commit hooks — gestión de configuración de seguridad (guía de remediación
# imarthe75, Paso 3, 2026-07-29). Instalar con: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
