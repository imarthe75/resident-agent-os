# Infraestructura local del Agente Residente: memoria de corto plazo (Valkey), memoria de largo plazo (PostgreSQL + pgvector) y el panel.
# Las versiones se resuelven con `python scripts/latest_versions.py` y se fijan aquí (nunca `latest`); `python verifiers/run.py --only versions_current`
# avisa cuando se quedan atrás. Los datos viven en ./data (relativo al host) y sobreviven a `docker compose down -v`.
# Variables obligatorias en .env (sin valores por omisión): POSTGRES_PASSWORD.
services:
  agent-cache:
    image: valkey/valkey:9.2
    container_name: agent-cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/valkey:/data
    command: valkey-server --save 60 1 --loglevel notice
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  agent-db:
    image: pgvector/pgvector:pg19
    container_name: agent-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-db_resident_knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./sql/agent_memory.sql:/docker-entrypoint-initdb.d/10-agent_memory.sql:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  resident-ui:
    build:
      context: ./resident-ui
      dockerfile: Dockerfile
    container_name: resident-ui-dashboard
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./resident-ui:/app
      - /app/node_modules
      - .:/workspace:ro
      - ./.agent:/workspace/.agent
      - ./data:/workspace/data
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - AGENT_DIR=/workspace/.agent
      - DATA_DIR=/workspace/data
      - WORKSPACE_ROOT=/workspace
      - VALKEY_HOST=agent-cache
      - VALKEY_PORT=6379
      - POSTGRES_HOST=agent-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-db_resident_knowledge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    depends_on:
      - agent-cache
      - agent-db
    restart: unless-stopped
