services:
  casmarts-core-cache:
    image: valkey/valkey:8
    container_name: casmarts-core-cache
    ports:
      - "6379:6379"
    volumes:
      - ./data/valkey:/data
    command: valkey-server --save 60 1 --loglevel notice
    restart: always
    networks:
      - aura-network
    deploy:
      resources:
        limits:
          memory: 512M

  casmarts-core-storage:
    image: chrislusf/seaweedfs:latest
    container_name: casmarts-core-storage
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8333:8333"
    volumes:
      - ./data/seaweedfs:/data
    command: server -dir=/data -s3 -s3.port=8333 -ip=casmarts-core-storage
    restart: always
    networks:
      - aura-network
    deploy:
      resources:
        limits:
          memory: 512M

  resident-ui:
    build:
      context: ./resident-ui
      dockerfile: Dockerfile
    container_name: resident-ui-dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./resident-ui:/app
      - /app/node_modules
      - ./.agent:/app/.agent
      - ./data:/app/data
    environment:
      - NODE_ENV=development
    depends_on:
      - casmarts-core-cache
    restart: always
    networks:
      - aura-network

  casmarts-core-proxy:
    image: nginx:alpine
    container_name: casmarts-core-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: always
    networks:
      - aura-network
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  aura-network:
    external: true
    name: aura-network
